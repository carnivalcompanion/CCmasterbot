services:
  - type: worker  # Keep as worker for automation
    name: music-video-automation
    env: python
    region: oregon
    plan: free
    branch: main
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: FREE_TIER_MODE
        value: "true"
      - key: PROCESS_LIMIT
        value: "1"  # Process only 1 video per cycle
      - key: CYCLE_INTERVAL
        value: "30"  # Check every 30 minutes instead of 20
    autoDeploy: true
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
